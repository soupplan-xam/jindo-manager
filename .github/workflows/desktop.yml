name: Build Windows widget

# desktop-v* 태그를 올리거나 Actions에서 직접 실행하면 윈도우 설치 파일(.exe)을 만든다.
on:
  push:
    tags: ['desktop-v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: jindo-widget-setup
          path: desktop/dist/*.exe
      - if: startsWith(github.ref, 'refs/tags/desktop-v')
        uses: softprops/action-gh-release@v2
        with:
          name: 진도계획표 위젯 ${{ github.ref_name }}
          files: desktop/dist/*.exe
          body: |
            진도계획표 바탕화면 위젯(윈도우) 설치 파일입니다.
            설치 중 'Windows의 PC 보호' 창이 뜨면 [추가 정보] → [실행]을 누르세요(코드 서명을 하지 않은 프로그램이라 뜨는 안내입니다).
